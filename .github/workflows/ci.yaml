name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, and locked tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: dev
          locked: true
      - name: Ruff lint
        run: pixi run --locked -e dev ruff check sygaldry tests .github/scripts
      - name: Ruff format
        run: pixi run --locked -e dev ruff format --check sygaldry tests .github/scripts
      - name: Type check
        run: pixi run --locked -e dev ty check sygaldry
      - name: Test with locked dependencies
        run: pixi run --locked -e dev pytest

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: >-
          python -m pip install -e . pytest pytest-cov pytest-mock pytest-sugar ty
          packaging 'tomli; python_version < "3.11"'
      - name: Test Python compatibility
        run: python -m pytest
