name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Do not interrupt a publication, or cancel a different commit's release.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yaml

  build:
    runs-on: ubuntu-latest
    needs: checks
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: build
          locked: true
      - name: Detect a version increase
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          COMMIT: ${{ github.sha }}
        run: pixi run --locked -e build python .github/scripts/release_version.py
      - name: Build wheel and source distribution
        if: steps.version.outputs.changed == 'true'
        run: |
          pixi run --locked -e build hatch build --clean
          pixi run --locked -e build twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.changed == 'true'
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.changed == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/sygaldry/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Permit recovery when an upload succeeded but a later step failed.
          skip-existing: true

  tag:
    runs-on: ubuntu-latest
    needs: [build, publish]
    permissions:
      contents: write
      actions: write
    env:
      TAG: v${{ needs.build.outputs.version }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the published commit
        run: |
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "${COMMIT}"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate "${TAG}" "${COMMIT}" --message "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
      # GITHUB_TOKEN tag pushes do not trigger the Docs workflow's push event.
      - name: Deploy documentation for the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yaml --ref main -f "tag=${TAG}"
